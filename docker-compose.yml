
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - EVALUAI_ALLOWED_ORIGINS=*
      - EVALUAI_SURVEYS_PATH=data/raw/EIPIA_FO_dataset_100_personas.xls
      - EVALUAI_COURSES_PATH=data/courses.csv
      - EVALUAI_MENTORS_PATH=data/mentors.csv

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=/evaluai/api/v1
    depends_on:
      - backend
