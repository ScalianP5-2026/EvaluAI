services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=true
      - LOG_LEVEL=INFO
      - EVALUAI_ALLOWED_ORIGINS=*
      - EVALUAI_SURVEYS_PATH=data/raw/EIPIA_FO_dataset_100_personas.xls
      - EVALUAI_COURSES_PATH=data/courses.csv
      - EVALUAI_MENTORS_PATH=data/mentors.csv
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - evaluai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - BACKEND_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    networks:
      - evaluai-net
    depends_on:
      - backend

networks:
  evaluai-net:
    driver: bridge