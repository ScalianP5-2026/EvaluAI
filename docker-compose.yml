version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - EVALUAI_ALLOWED_ORIGINS=*
      - EVALUAI_SURVEYS_PATH=data/datos_encuesta_formacion_ia.csv
      - EVALUAI_COURSES_PATH=data/courses.csv
      - EVALUAI_MENTORS_PATH=data/mentors.csv

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
